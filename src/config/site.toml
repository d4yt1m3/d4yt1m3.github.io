[config.site]
title = "d4yt1m3"
description = "一个安静的个人空间，用来记录写作、项目与日常。"
pageTitle = "d4yt1m3 | 个人主页"
pageDescription = "记录笔记、项目与生活碎片的个人站点。"
url = "https://d4yt1m3.github.io"
repository = "https://github.com/d4yt1m3/d4yt1m3.github.io"
footerNote = "用 Astro 与 Navfolio 搭建。"

[config.theme]
# 可用色盘：
# green-soft, green-vivid, rose-soft, pink-soft, purple-soft, blue-soft, orange-soft, brown-soft
palette = "green-soft"
# 原生 UI 语言。可用值：en、zh-CN、zh-TW。未知值会回退到 en。
lang = "zh-CN"

[config.fonts]
# 英文与代码感 UI 字体
en = "Maple Mono"
code = "Monaco"
# 模板内可直接选择：ChillRoundM、LXGW WenKai
# 中文阅读字体
zh = "ChillRoundM"
# 中文完整字体文件
file = "/fonts/ChillRoundM.ttf"

[config.code]
lightTheme = "catppuccin-latte"
darkTheme = "catppuccin-macchiato"
lineNumbers = true
wrap = true
preserveIndent = true
collapseStyle = "collapsible-auto"

[config.math]
render = "katex" # "katex" | "mathjax"

[config.comments]
enabled = false
provider = "none"
show_on_posts = true

[config.search]
enabled = true
shortcut = "mod+k"
placeholder = "搜索笔记..."
maxResults = 6

[config.pages.blog]
title = "写作"
kicker = "笔记归档"
subtitle = "从页边空白处写下的东西。"
note = "长文、教程与项目记录，按时间慢慢展开。"
postsPerPage = 6
# date-fns 使用的日期格式模板。
dateFormat = "yyyy-MM-dd"
# 元信息分隔符。可以使用 "|"、"/" 等符号，也可以使用特殊值 "icon"。
metadataSeparator = "icon"
# 文章列表封面样式："card" 保留带边框的缩略图，"mask" 会将图片融合到右侧。
coverImageStyle = "mask"

[config.pages.blog.categories]
title = "分类"
kicker = "按主题浏览"
subtitle = ""
note = "从文章 frontmatter 中自动汇总的主题索引。"

[config.pages.blog.series]
title = "系列"
kicker = "阅读路径"
subtitle = ""
note = "按写作顺序串联起来的系列文章。"

[config.pages.projects]
title = "项目"
kicker = "项目架"
subtitle = "小而具体的工具与站点系统。"
note = "记录实现选择、版本与发布过程的项目文档。"

[config.pages.vibe]
title = "碎片"
kicker = ""
subtitle = "生活与编码的片段。"
note = "不足以写成文章，但仍是故事的一部分。"
showTrail = true

[config.pages.media]
title = "书影音"
subtitle = "读过、看过、听过的作品，以及一点当时的感受。"
note = "一页浏览书、电影、剧集、专辑与播客。"

[config.comments.giscus]
repo = ""
repo_id = ""
category = ""
category_id = ""
mapping = "pathname"
strict = "0"
reactions_enabled = "1"
emit_metadata = "0"
input_position = "top"
light_theme = "light"
dark_theme = "dark"
lang = "zh-CN"
loading = "lazy"

[config.comments.utterances]
repo = ""
issue_term = "pathname"
label = "comment"
theme = "github-light"

[config.comments.waline]
server_url = ""
lang = "zh-CN"
dark = "html.dark"
pageview = true
comment = true

[config.profile]
name = "d4yt1m3"
handle = "@d4yt1m3"
role = "写代码，也写字"
email = "d4yt1m3@users.noreply.github.com"
website = "https://d4yt1m3.github.io"
github = "https://github.com/d4yt1m3"
avatar = "/images/logo-thin.webp"

[[config.topNav.links]]
label = "首页"
